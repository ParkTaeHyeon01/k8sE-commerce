apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: kafka-consumer-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
      - name: kafka-consumer
        image: 192.168.0.54/ecommerce/kafka-consumer:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: kafka-consumer-config
        - secretRef:
            name: kafka-consumer-secret
