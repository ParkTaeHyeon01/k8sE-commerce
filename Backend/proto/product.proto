syntax = "proto3";

package product;

service ProductService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc DecrementStock(DecrementStockRequest) returns (DecrementStockResponse);
  rpc IncrementStock(IncrementStockRequest) returns (IncrementStockResponse);
}

message ListProductsRequest {
  string target        = 1; // "best" | "sales" | "" (전체)
  string category_code = 2; // "" = 전체 카테고리
  int32  page          = 3; // 1-based
  int32  page_size     = 4; // 기본 20
  string sort_by       = 5; // "" | "rank" | "price_asc" | "price_desc" | "discount_desc"
  string search        = 6; // 검색어
  string search_by     = 7; // "id" → product_id 정확 검색, "name" 또는 "" → $text 검색
}

message ListProductsResponse {
  repeated ProductSummary products = 1;
  int32 total   = 2; // 전체 건수 (페이지네이션용)
  int32 page     = 3;
  int32 page_size = 4;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  ProductDetail product = 1;
  bool found = 2;
}

message Category {
  string code  = 1;
  string name  = 2;
  int32  count = 3;
}

message ListCategoriesRequest {
  string target = 1; // "best" | "sales"
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

// 목록용 - 카드에 필요한 필드만
message ProductSummary {
  string product_id    = 1;
  string name          = 2;
  int32  sale_price    = 3;
  int32  original_price = 4;
  int32  discount_rate  = 5;
  string image_url     = 6;
  string category_code  = 7;
  string category_name  = 8;
  repeated string targets = 9;
  string delivery_info  = 10;
  int32  stock          = 11;
}

// 상세용 - 전체 필드
message DetailBlock {
  string type  = 1; // "image" | "text"
  string value = 2;
}

message ProductDetail {
  string product_id     = 1;
  string name           = 2;
  int32  sale_price     = 3;
  int32  original_price  = 4;
  int32  discount_rate   = 5;
  string image_url      = 6;
  string detail_url     = 7;
  string category_code   = 8;
  string category_name   = 9;
  repeated string targets = 10;
  string delivery_info   = 11;
  repeated DetailBlock detail_blocks = 12;
  string status         = 13;
  string crawled_at     = 14;
  int32  stock          = 15;
}

// 재고 관련 메시지
message UpdateStockRequest {
  string product_id = 1;
  int32  stock      = 2;
}
message UpdateStockResponse {
  bool success = 1;
}

message DeleteProductRequest {
  string product_id = 1;
}
message DeleteProductResponse {
  bool success = 1;
}

message DecrementStockRequest {
  string product_id = 1;
  int32  quantity   = 2;
}
message DecrementStockResponse {
  bool success      = 1;
  int32 stock_after = 2;
}

message IncrementStockRequest {
  string product_id = 1;
  int32  quantity   = 2;
}
message IncrementStockResponse {
  bool success      = 1;
  int32 stock_after = 2;
}
