apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # MongoDB URI (인증 포함 — 특수문자는 URL 인코딩 필요, 예: # -> %23)
  MONGODB_URI: "mongodb://admin:CHANGE_ME@mongodb-svc:27017/?authSource=admin"

  # MariaDB 비밀번호
  MARIADB_PASSWORD: "CHANGE_ME"

  # JWT 서명 키 (gateway, auth-member 공통)
  JWT_SECRET: "CHANGE_ME"
