# ── gRPC 서버 ────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: benchmark-grpc-secret
  namespace: benchmark-ns
type: Opaque
stringData:
  MONGODB_URI: "mongodb://kevin:k8spass%23@mongodb-svc.mongodb-ns.svc.cluster.local:27017/?authSource=ecommerce"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-grpc-config
  namespace: benchmark-ns
data:
  MONGODB_DB: "ecommerce"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-server
  namespace: benchmark-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-server
  template:
    metadata:
      labels:
        app: grpc-server
    spec:
      containers:
      - name: grpc-server
        image: 192.168.0.64/ecommerce/benchmark-grpc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
        env:
        - name: OPENSSL_ia32cap
          value: "~0:~0x20000000"
        - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
          value: "python"
        envFrom:
        - configMapRef:
            name: benchmark-grpc-config
        - secretRef:
            name: benchmark-grpc-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-server-svc
  namespace: benchmark-ns
spec:
  selector:
    app: grpc-server
  ports:
  - port: 50051
    targetPort: 50051
# ── REST 서버 ────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: benchmark-rest-secret
  namespace: benchmark-ns
type: Opaque
stringData:
  MONGODB_URI: "mongodb://kevin:k8spass%23@mongodb-svc.mongodb-ns.svc.cluster.local:27017/?authSource=ecommerce"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-rest-config
  namespace: benchmark-ns
data:
  MONGODB_DB: "ecommerce"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: benchmark-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      containers:
      - name: rest-server
        image: 192.168.0.64/ecommerce/benchmark-rest:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: benchmark-rest-config
        - secretRef:
            name: benchmark-rest-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rest-server-svc
  namespace: benchmark-ns
spec:
  selector:
    app: rest-server
  ports:
  - port: 8000
    targetPort: 8000
# ── 벤치마크 클라이언트 ──────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-client
  namespace: benchmark-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-client
  template:
    metadata:
      labels:
        app: benchmark-client
    spec:
      containers:
      - name: benchmark-client
        image: 192.168.0.64/ecommerce/benchmark-client:latest
        imagePullPolicy: Always
        env:
        - name: GRPC_SERVER
          value: "grpc-server-svc:50051"
        - name: REST_SERVER
          value: "http://rest-server-svc:8000"
        - name: OPENSSL_ia32cap
          value: "~0:~0x20000000"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
# ── NetworkPolicy: benchmark-ns → mongodb-ns:27017 ───────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-benchmark-to-mongodb
  namespace: mongodb-ns
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: benchmark-ns
    ports:
    - port: 27017
