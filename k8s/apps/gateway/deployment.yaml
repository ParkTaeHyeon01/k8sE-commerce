apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gateway-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: 192.168.0.54/ecommerce/gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: gateway-config
        - secretRef:
            name: gateway-secret
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: gateway-ns
spec:
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
